<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VELNORA Admin Dashboard</title>
  <link rel="stylesheet" href="csss/admin.css" />
</head>
<body>
  <div class="admin-container">
    <h1>🎧 VELNORA Admin Dashboard</h1>
    <p>Manage events and gallery images.</p>

    <!-- Add Event -->
    <section class="card">
      <h2>Add New Event</h2>

      <input type="text" id="eventTitle" placeholder="Event Title">
      <input type="text" id="eventDate" placeholder="Date and Location">
      <input type="file" id="eventImages" multiple accept="image/*">

      <button onclick="addEvent()">➕ Add Event</button>
    </section>

    <!-- Events List -->
    <section class="card">
      <h2>Current Events</h2>
      <div id="eventsList"></div>
    </section>

    <!-- Gallery Upload -->
    <section class="card">
      <h2>Gallery Images</h2>

      <input type="file" id="galleryImages" multiple accept="image/*">
      <button onclick="addGalleryImages()">🖼️ Add Gallery Images</button>

      <div id="galleryList"></div>
    </section>
  </div>

 <script type="module" src="jss/admin.js"></script>
</body>
</html>
