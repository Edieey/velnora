<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELNORA | Event</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/eventsnew.css">
</head>

<body>

    <!-- Navigation -->
<header class="navbar">

<a href="index.html" class="mobile-home">
<svg xmlns="http://www.w3.org/2000/svg"
     width="28"
     height="28"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="2.5"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M3 10.5L12 3l9 7.5"/>
    <path d="M5 9.5V21h14V9.5"/>
    <path d="M9 21v-6h6v6"/>
</svg>
</a>

<a href="index.html" class="logo">
    <img src="images/logo.png"
         class="mobile-logo"
         alt="VELNORA">
</a>

    <div class="menu-toggle">
        ☰
    </div>

    <nav class="nav-menu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="booking.html">Booking</a></li>
        </ul>
    </nav>

    <div class="menu-overlay"></div>

</header>

    <!-- HERO -->
    <section class="event-hero">

        <div id="heroSlider" class="hero-slider"></div>

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <span id="eventDate" class="event-date">
                Loading Event...
            </span>

            <h1 id="eventTitle" class="event-title">
                Loading...
            </h1>

            <p id="eventVenue" class="event-location">
                Loading venue...
            </p>

            <a id="ticketButton"
               href="#"
               target="_blank"
               class="ticket-btn">
                GET TICKETS
            </a>

            <div class="scroll-indicator">
                Scroll to Explore
            </div>

        </div>

    </section>

    <!-- ABOUT -->

    <section class="about-event">

        <div class="container">

            <h2>About The Event</h2>

            <div id="eventDescription">
                Loading...
            </div>

        </div>

    </section>

    <!-- LINEUP -->

    <section class="lineup">

        <div class="container">

            <h2>Line Up</h2>

            <div id="lineupGrid" class="lineup-grid">

            </div>

        </div>

    </section>

    <!-- GALLERY -->

    <section class="event-gallery">

        <div class="container">

            <h2>Gallery</h2>

            <div id="galleryGrid" class="gallery-grid">

            </div>

        </div>

    </section>

    <!-- FOOTER -->

    <footer class="footer">

        <p class="footer-copy">
            © 2026 VELNORA. Dream. Gather. Belong.
        </p>

    </footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script src="js/cms.js"></script>
<script src="js/eventsnew.js"></script>
<script src="js/main.js"></script>

</body>
</html>
