<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELNORA | Event</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/eventsnew.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="images/velnora-text.png" class="logo-text" alt="VELNORA">
        </a>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html" class="active">Events</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="booking.html">Booking</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO -->
    <section class="event-hero">

        <div id="heroSlider" class="hero-slider"></div>

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <span id="eventDate" class="event-date">
                Loading Event...
            </span>

            <h1 id="eventTitle" class="event-title">
                Loading...
            </h1>

            <p id="eventVenue" class="event-location">
                Loading venue...
            </p>

            <a id="ticketButton"
               href="#"
               target="_blank"
               class="ticket-btn">
                GET TICKETS
            </a>

            <div class="scroll-indicator">
                Scroll to Explore
            </div>

        </div>

    </section>

    <!-- ABOUT -->

    <section class="about-event">

        <div class="container">

            <h2>About The Event</h2>

            <div id="eventDescription">
                Loading...
            </div>

        </div>

    </section>

    <!-- LINEUP -->

    <section class="lineup">

        <div class="container">

            <h2>Line Up</h2>

            <div id="lineupGrid" class="lineup-grid">

            </div>

        </div>

    </section>

    <!-- GALLERY -->

    <section class="event-gallery">

        <div class="container">

            <h2>Gallery</h2>

            <div id="galleryGrid" class="gallery-grid">

            </div>

        </div>

    </section>

    <!-- FOOTER -->

    <footer class="footer">

        <p class="footer-copy">
            © 2026 VELNORA. Dream. Gather. Belong.
        </p>

    </footer>

    <script src="js/cms.js"></script>
    <script src="js/eventsnew.js"></script>

</body>

</html>
