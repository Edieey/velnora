backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "events"
    label: "Events"
    folder: "content/events"
    create: true
    slug: "{{slug}}"

    fields:
      - { label: "Event Title", name: "title", widget: "string" }

      - { label: "Slug", name: "slug", widget: "string", hint: "Example: velnora-alchemy" }

      - { label: "Date", name: "date", widget: "string" }

      - { label: "Time", name: "time", widget: "string" }

      - { label: "Venue", name: "venue", widget: "string" }

      - { label: "Cover Poster", name: "image", widget: "image" }

      - label: "Line Up"
        name: "lineup"
        widget: "list"
        field:
          label: "Artist"
          name: "artist"
          widget: "string"

      - { label: "Ticket Button Text", name: "button_text", widget: "string", default: "GET TICKETS" }

      - { label: "Ticket URL", name: "ticket_url", widget: "string", required: false }

      - label: "Gallery"
        name: "gallery"
        widget: "list"
        field:
          label: "Gallery Image"
          name: "gallery_image"
          widget: "image"

      - label: "About Event"
        name: "body"
        widget: "markdown"

  - name: "memories"
    label: "Memories"
    folder: "content/memories"
    create: true
    slug: "{{slug}}"

    fields:
      - { label: "Title", name: "title", widget: "string" }

      - { label: "Location", name: "location", widget: "string" }

      - { label: "Date", name: "date", widget: "string" }

      - { label: "Cover Image", name: "image", widget: "image" }

      - label: "Card Click Action"
        name: "click_action"
        widget: "select"
        default: "gallery"
        options:
          - label: "Gallery Popup"
            value: "gallery"
          - label: "External Link"
            value: "link"

      - label: "External Link"
        name: "external_link"
        widget: "string"
        required: false
        hint: "Instagram Reel, YouTube video, TikTok, or any other URL"

      - label: "Gallery"
        name: "gallery"
        widget: "list"
        required: false
        field:
          label: "Gallery Image"
          name: "gallery_image"
          widget: "image"

      - { label: "Description", name: "body", widget: "markdown" }

            
  - name: "gallery"
    label: "Gallery"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"

    fields:
      - { label: "Album Title", name: "title", widget: "string" }

      - label: "Images"
        name: "images"
        widget: "bulk-gallery"
  - name: "artists"
    label: "Artists"
    folder: "content/artists"
    create: true
    slug: "{{slug}}"

    fields:
      - { label: "Artist Name", name: "title", widget: "string" }
      - { label: "Genre", name: "genre", widget: "string" }
      - { label: "Artist Image", name: "image", widget: "image" }

  - name: "hero"
    label: "Hero"

    files:
      - label: "Hero"
        name: "hero"
        file: "content/hero/hero.md"

        fields:
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Button Text", name: "button", widget: "string" }
          - { label: "Button Link", name: "link", widget: "string" }

          - label: "Display Type"
            name: "type"
            widget: "select"
            options:
              - "video"
              - "image"
              - "slideshow"

          - label: "Hero Video"
            name: "video"
            widget: "file"
            required: false

          - label: "Hero Image"
            name: "image"
            widget: "image"
            required: false
          - label: "Hero Slideshow Images"
            name: "slides"
            widget: "list"
            required: false
            field:
              label: "Hero Image"
              name: "image"
              widget: "image"

  - name: "settings"
    label: "Site Settings"

    files:
      - label: "Website Settings"
        name: "website"
        file: "content/settings/website.md"

        fields:
          - { label: "About Title", name: "about_title", widget: "string" }
          - { label: "About Description", name: "about_description", widget: "text" }
          - { label: "Contact Phone", name: "phone", widget: "string" }
          - { label: "Contact Email", name: "email", widget: "string" }
          - { label: "Instagram", name: "instagram", widget: "string" }
          - { label: "Address", name: "address", widget: "text" }
          - { label: "Booking Title", name: "booking_title", widget: "string" }
          - { label: "Booking Description", name: "booking_description", widget: "text" }
          - { label: "Booking Button", name: "booking_button", widget: "string" }
          - { label: "Copyright", name: "copyright", widget: "string" }
  - name: "products"
    label: "Products"
    folder: "content/store/products"
    create: true
    slug: "{{slug}}"

    fields:

      - { label: "Product Name", name: "title", widget: "string" }

      - label: "Category"
        name: "category"
        widget: "select"
        default: "apparel"
        options:
          - label: "Apparel"
            value: "apparel"
          - label: "Accessories"
            value: "accessories"
          - label: "Headwear"
            value: "headwear"
          - label: "Jerseys"
            value: "jerseys"
          - label: "Limited Edition"
            value: "limited-edition"
          - label: "Event Merchandise"
            value: "event-merchandise"
          - label: "Other"
            value: "other"
      - label: "T-Shirt Type"
        name: "tshirt_type"
        widget: "select"
        multiple: true
        required: false
        options:
          - label: "Normal"
            value: "normal"
          - label: "Drop Shoulder"
            value: "drop-shoulder"
      - { label: "Price (MVR)", name: "price", widget: "number", value_type: "float", min: 0 }
      - { label: "Price (USD)", name: "price_usd", widget: "number", value_type: "float", min: 0 }

      - { label: "Main Product Image", name: "image", widget: "image" }

      - label: "Product Gallery"
        name: "images"
        widget: "bulk-gallery"
        required: false

      - { label: "Description", name: "body", widget: "markdown" }

      - label: "Available Sizes"
        name: "sizes"
        widget: "list"
        required: false
        field:
          label: "Size"
          name: "size"
          widget: "string"

      - label: "Available Colours"
        name: "colours"
        widget: "list"
        required: false
        fields:
          - { label: "Colour Name", name: "name", widget: "string" }
          - { label: "Colour Code", name: "code", widget: "string", hint: "Example: #000000" }

      - label: "Product Status"
        name: "status"
        widget: "select"
        default: "available"
        options:
          - label: "Available"
            value: "available"
          - label: "Sold Out"
            value: "sold-out"
          - label: "Hidden"
            value: "hidden"

      - { label: "Purchase Button Text", name: "button_text", widget: "string", default: "PURCHASE NOW" }

  - name: "store_settings"
    label: "Store Settings"

    files:
      - label: "Store Settings"
        name: "store"
        file: "content/store/settings.md"

        fields:

          - { label: "Store Title", name: "store_title", widget: "string", default: "VELNORA Store" }

          - { label: "Store Description", name: "store_description", widget: "text", default: "Premium merchandise crafted for the VELNORA community." }

          - label: "MVR Payment Account"
            name: "mvr_payment"
            widget: "object"
            fields:
              - { label: "Bank Name", name: "bank_name", widget: "string" }
              - { label: "Account Name", name: "account_name", widget: "string" }
              - { label: "Account Number", name: "account_number", widget: "string" }

          - label: "USD Payment Account"
            name: "usd_payment"
            widget: "object"
            fields:
              - { label: "Bank Name", name: "bank_name", widget: "string" }
              - { label: "Account Name", name: "account_name", widget: "string" }
              - { label: "Account Number", name: "account_number", widget: "string" }

          - { label: "Payment Instructions", name: "payment_instructions", widget: "text" }

          - { label: "Delivery Information", name: "delivery_information", widget: "text", default: "Delivery within 7–10 days within Maldives." }

          - { label: "Order Button Text", name: "order_button_text", widget: "string", default: "PROCESS PURCHASE" }

          - { label: "Customer Confirmation Message", name: "customer_confirmation", widget: "text" }

          - { label: "Order Notification Email", name: "order_email", widget: "string" }

          - { label: "WhatsApp Number", name: "whatsapp_number", widget: "string" }